paths:
  /api/analytics/flows/list:
    post:
      consumes:
      - application/json
      operationId: listAnalyticsFlows
      parameters:
      - description: 查询参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AnalyticsFlowListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-AnalyticsFlowListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Response-any'
      summary: 分页查询资金流水
      tags:
      - analytics
  /api/analytics/member:
    get:
      operationId: getAnalyticsMember
      parameters:
      - example: "2026-09-17 23:59:59"
        in: query
        name: end_time
        type: string
      - example: "2026-09-01 00:00:00"
        in: query
        name: start_time
        type: string
      - example: last_7_days
        in: query
        name: time_range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-AnalyticsMemberResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Response-any'
      summary: 获取会员数据分析
      tags:
      - analytics
  /api/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      parameters:
      - example: "2026-09-17 23:59:59"
        in: query
        name: end_time
        type: string
      - example: "2026-09-01 00:00:00"
        in: query
        name: start_time
        type: string
      - description: today, yesterday, last_7_days, last_30_days, this_month, last_month,
          custom
        example: today
        in: query
        name: time_range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-AnalyticsOverviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Response-any'
