basePath: /
definitions:
  CreateRequest:
    properties:
      nickname:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
      status:
        type: integer
      username:
        maxLength: 64
        type: string
    required:
    - password
    - username
    type: object
  CurrentRole:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: integer
    type: object
  CurrentUser:
    properties:
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  CurrentUserResponse:
    properties:
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          $ref: '#/definitions/CurrentRole'
        type: array
      user:
        $ref: '#/definitions/CurrentUser'
    type: object
  DemoData:
    properties:
      database:
        example: not_configured
        type: string
      message:
        example: Mall API is running
        type: string
    type: object
  HealthData:
    properties:
      database:
        example: not_configured
        type: string
      service:
        example: mall-admin-core
        type: string
      status:
        example: ok
        type: string
    type: object
  HelloData:
    properties:
      message:
        example: Hello from plugin
        type: string
      plugin:
        example: hello
        type: string
    type: object
  IDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  ListRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      username:
        type: string
    type: object
  LoginRequest:
    properties:
      password:
        maxLength: 72
        type: string
      remember:
        type: boolean
      username:
        maxLength: 64
        type: string
    required:
    - password
    - username
    type: object
  LoginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  PermissionDefinition:
    properties:
      code:
        type: string
      module:
        type: string
      name:
        type: string
    type: object
  Response-CurrentUserResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/CurrentUserResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-LoginResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/LoginResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-RoleRow:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/RoleRow'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-UserRow:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/UserRow'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-any:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_CurrentRole:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/CurrentRole'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_PermissionDefinition:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/PermissionDefinition'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_RoleRow:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/RoleRow'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_UserRow:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/UserRow'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_string:
    properties:
      code:
        type: integer
      data:
        items:
          type: string
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-demo_DemoData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/DemoData'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-health_HealthData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/HealthData'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-hello_HelloData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/HelloData'
      message:
        type: string
      total:
        type: integer
    type: object
  RoleCreateRequest:
    properties:
      name:
        maxLength: 64
        type: string
      remark:
        maxLength: 255
        type: string
      sort:
        type: integer
      status:
        type: integer
    required:
    - name
    type: object
  RoleIDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  RoleListRequest:
    properties:
      keyword:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      status:
        type: integer
    type: object
  RolePermissionRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  RoleRow:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
    type: object
  RoleSavePermissionRequest:
    properties:
      id:
        type: integer
      permissions:
        items:
          type: string
        type: array
    required:
    - id
    type: object
  RoleUpdateRequest:
    properties:
      id:
        type: integer
      name:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
    required:
    - id
    type: object
  UpdateRequest:
    properties:
      id:
        type: integer
      nickname:
        type: string
      password:
        type: string
      status:
        type: integer
      username:
        type: string
    required:
    - id
    type: object
  UserRoleRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  UserRow:
    properties:
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  UserSaveRoleRequest:
    properties:
      id:
        type: integer
      role_ids:
        items:
          type: integer
        type: array
    required:
    - id
    type: object
host: localhost:8080
info:
  contact: {}
  description: Simple commerce administration backend.
  title: Mall Admin Core API
  version: 0.1.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      operationId: login
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-LoginResponse'
      summary: Login to the admin API
      tags:
      - auth
  /api/auth/me:
    get:
      operationId: getCurrentUser
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-CurrentUserResponse'
      security:
      - BearerAuth: []
      summary: Get the current login user, roles, and permissions
      tags:
      - auth
  /api/demo:
    get:
      operationId: getDemo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-demo_DemoData'
      summary: Get backend demo data
      tags:
      - demo
  /api/plugins/hello:
    get:
      operationId: getHelloPlugin
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-hello_HelloData'
      summary: Get hello plugin data
      tags:
      - plugins
  /api/system/permissions/list:
    get:
      operationId: listAllPermissions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_PermissionDefinition'
      security:
      - BearerAuth: []
      summary: List all permission definitions
      tags:
      - system-permission
  /api/system/roles/create:
    post:
      consumes:
      - application/json
      operationId: createSystemRole
      parameters:
      - description: Create system role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-RoleRow'
      security:
      - BearerAuth: []
      summary: Create a system role
      tags:
      - system-role
  /api/system/roles/delete:
    post:
      consumes:
      - application/json
      operationId: deleteSystemRole
      parameters:
      - description: Delete system role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Delete a system role
      tags:
      - system-role
  /api/system/roles/detail:
    post:
      consumes:
      - application/json
      operationId: getSystemRole
      parameters:
      - description: Get system role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-RoleRow'
      security:
      - BearerAuth: []
      summary: Get a system role
      tags:
      - system-role
  /api/system/roles/list:
    post:
      consumes:
      - application/json
      operationId: listSystemRoles
      parameters:
      - description: List system roles request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_RoleRow'
      security:
      - BearerAuth: []
      summary: List system roles
      tags:
      - system-role
  /api/system/roles/permissions:
    post:
      consumes:
      - application/json
      operationId: getSystemRolePermissions
      parameters:
      - description: Role permissions request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RolePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_string'
      security:
      - BearerAuth: []
      summary: Get permissions assigned to a role
      tags:
      - system-role
  /api/system/roles/permissions/save:
    post:
      consumes:
      - application/json
      operationId: saveSystemRolePermissions
      parameters:
      - description: Save role permissions request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleSavePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Replace all permissions assigned to a role
      tags:
      - system-role
  /api/system/roles/update:
    post:
      consumes:
      - application/json
      operationId: updateSystemRole
      parameters:
      - description: Update system role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-RoleRow'
      security:
      - BearerAuth: []
      summary: Update a system role
      tags:
      - system-role
  /api/system/users/create:
    post:
      consumes:
      - application/json
      operationId: createSystemUser
      parameters:
      - description: Create system user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-UserRow'
      security:
      - BearerAuth: []
      summary: Create a system user
      tags:
      - system-user
  /api/system/users/delete:
    post:
      consumes:
      - application/json
      operationId: deleteSystemUser
      parameters:
      - description: Delete system user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/IDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Delete a system user
      tags:
      - system-user
  /api/system/users/detail:
    post:
      consumes:
      - application/json
      operationId: getSystemUser
      parameters:
      - description: Get system user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/IDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-UserRow'
      security:
      - BearerAuth: []
      summary: Get a system user
      tags:
      - system-user
  /api/system/users/list:
    post:
      consumes:
      - application/json
      operationId: listSystemUsers
      parameters:
      - description: List system users request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_UserRow'
      security:
      - BearerAuth: []
      summary: List system users
      tags:
      - system-user
  /api/system/users/roles:
    post:
      consumes:
      - application/json
      operationId: getSystemUserRoles
      parameters:
      - description: User roles request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_CurrentRole'
      security:
      - BearerAuth: []
      summary: Get roles assigned to a user
      tags:
      - system-user
  /api/system/users/roles/save:
    post:
      consumes:
      - application/json
      operationId: saveSystemUserRoles
      parameters:
      - description: Save user roles request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UserSaveRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Replace all roles assigned to a user
      tags:
      - system-user
  /api/system/users/update:
    post:
      consumes:
      - application/json
      operationId: updateSystemUser
      parameters:
      - description: Update system user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-UserRow'
      security:
      - BearerAuth: []
      summary: Update a system user
      tags:
      - system-user
  /health:
    get:
      operationId: getHealth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-health_HealthData'
      summary: Check service health
      tags:
      - system
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
