        type: string
      ext:
        type: string
      group_id:
        type: integer
      height:
        type: integer
      id:
        type: integer
      name:
        type: string
      path:
        type: string
      size:
        type: integer
      storage:
        type: string
      url:
        type: string
      width:
        type: integer
    required:
    - created_at
    - ext
    - group_id
    - height
    - id
    - name
    - path
    - size
    - storage
    - url
    - width
    type: object
  FileStorageConfig:
    properties:
      cos:
        $ref: '#/definitions/FileObjectConfig'
      default_storage:
        enum:
        - local
        - oss
        - cos
        - s3
        type: string
