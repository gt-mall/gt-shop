        example: not_configured
        type: string
      service:
        example: mall-admin-core
        type: string
      status:
        example: ok
        type: string
    type: object
  HelloData:
    properties:
      message:
        example: Hello from plugin
        type: string
      plugin:
        example: hello
        type: string
    type: object
  IDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  ListRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      username:
        type: string
    type: object
  LoginRequest:
    properties:
      password:
        maxLength: 72
        type: string
      remember:
