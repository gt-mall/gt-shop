      total_storage_size:
        type: integer
      ungrouped:
        type: integer
      ungrouped_storage_size:
        type: integer
    required:
    - groups
    - total
    - total_storage_size
    - ungrouped
    - ungrouped_storage_size
    type: object
  FileGroupIDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  FileGroupRow:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
      storage_size:
        type: integer
    required:
    - count
    - id
    - name
    - storage_size
    type: object
  FileGroupSaveRequest:
    properties:
      id:
        minimum: 0
        type: integer
      name:
        maxLength: 64
        type: string
    required:
    - name
    type: object
  FileIDsRequest:
    properties:
      ids:
        items:
          type: integer
        maxItems: 100
        minItems: 1
        type: array
    required:
    - ids
    type: object
  FileListRequest:
    properties:
      group_id:
        minimum: 0
        type: integer
      keyword:
        maxLength: 255
        type: string
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  FileLocalConfig:
    properties:
      domain:
        type: string
      path:
        type: string
    required:
    - path
    type: object
  FileMoveRequest:
    properties:
      group_id:
        minimum: 0
        type: integer
      ids:
        items:
          type: integer
        maxItems: 100
        minItems: 1
        type: array
    required:
    - ids
    type: object
  FileObjectConfig:
    properties:
      access_key_id:
        type: string
      access_key_secret:
        type: string
      bucket:
        type: string
      domain:
        type: string
      endpoint:
        type: string
      region:
        type: string
      secret_set:
        type: boolean
      use_path_style:
        type: boolean
    type: object
  FileRenameRequest:
    properties:
      id:
        type: integer
      name:
        maxLength: 255
        type: string
    required:
    - id
    - name
    type: object
  FileRow:
    properties:
