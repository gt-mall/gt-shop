basePath: /
definitions:
  CreateRequest:
    properties:
      nickname:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
      status:
        type: integer
      username:
        maxLength: 64
        type: string
    required:
    - password
    - username
    type: object
  CurrentRole:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: integer
    type: object
  CurrentUser:
    properties:
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  CurrentUserResponse:
    properties:
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          $ref: '#/definitions/CurrentRole'
        type: array
      user:
        $ref: '#/definitions/CurrentUser'
    type: object
  DemoData:
    properties:
      database:
        example: not_configured
        type: string
      message:
        example: Mall API is running
        type: string
    type: object
  FileGroupCounts:
    properties:
      groups:
        items:
          $ref: '#/definitions/FileGroupRow'
        type: array
      total:
        type: integer
      total_storage_size:
        type: integer
      ungrouped:
        type: integer
      ungrouped_storage_size:
        type: integer
    required:
    - groups
    - total
    - total_storage_size
    - ungrouped
    - ungrouped_storage_size
    type: object
  FileGroupIDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  FileGroupRow:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
      storage_size:
        type: integer
    required:
    - count
    - id
    - name
    - storage_size
    type: object
  FileGroupSaveRequest:
    properties:
      id:
        minimum: 0
        type: integer
      name:
        maxLength: 64
        type: string
    required:
    - name
    type: object
  FileIDsRequest:
    properties:
      ids:
        items:
          type: integer
        maxItems: 100
        minItems: 1
        type: array
    required:
    - ids
    type: object
  FileListRequest:
    properties:
      group_id:
        minimum: 0
        type: integer
      keyword:
        maxLength: 255
        type: string
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  FileLocalConfig:
    properties:
      domain:
        type: string
      path:
        type: string
    required:
    - path
    type: object
  FileMoveRequest:
    properties:
      group_id:
        minimum: 0
        type: integer
      ids:
        items:
          type: integer
        maxItems: 100
        minItems: 1
        type: array
    required:
    - ids
    type: object
  FileObjectConfig:
    properties:
      access_key_id:
        type: string
      access_key_secret:
        type: string
      bucket:
        type: string
      domain:
        type: string
      endpoint:
        type: string
      region:
        type: string
      secret_set:
        type: boolean
      use_path_style:
        type: boolean
    type: object
  FileRenameRequest:
    properties:
      id:
        type: integer
      name:
        maxLength: 255
        type: string
    required:
    - id
    - name
    type: object
  FileRow:
    properties:
      created_at:
        type: string
      ext:
        type: string
      group_id:
        type: integer
      height:
        type: integer
      id:
        type: integer
      name:
        type: string
      path:
        type: string
      size:
        type: integer
      storage:
        type: string
      url:
        type: string
      width:
        type: integer
    required:
    - created_at
    - ext
    - group_id
    - height
    - id
    - name
    - path
    - size
    - storage
    - url
    - width
    type: object
  FileStorageConfig:
    properties:
      cos:
        $ref: '#/definitions/FileObjectConfig'
      default_storage:
        enum:
        - local
        - oss
        - cos
        - s3
        type: string
      local:
        $ref: '#/definitions/FileLocalConfig'
      oss:
        $ref: '#/definitions/FileObjectConfig'
      s3:
        $ref: '#/definitions/FileObjectConfig'
    required:
    - cos
    - default_storage
    - local
    - oss
    - s3
    type: object
  HealthData:
    properties:
      database:
        example: not_configured
        type: string
      service:
        example: mall-admin-core
        type: string
      status:
        example: ok
        type: string
    type: object
  HelloData:
    properties:
      message:
        example: Hello from plugin
        type: string
      plugin:
        example: hello
        type: string
    type: object
  IDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  ListRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      username:
        type: string
    type: object
  LoginRequest:
    properties:
      password:
        maxLength: 72
        type: string
      remember:
        type: boolean
      username:
        maxLength: 64
        type: string
    required:
    - password
    - username
    type: object
  LoginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  PermissionDefinition:
    properties:
      code:
        type: string
      module:
        type: string
      name:
        type: string
    type: object
  Response-CurrentUserResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/CurrentUserResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-FileGroupCounts:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/FileGroupCounts'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-FileRow:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/FileRow'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-FileStorageConfig:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/FileStorageConfig'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-LoginResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/LoginResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-RoleRow:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/RoleRow'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-ShopBasicConfig:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/ShopBasicConfig'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-SiteBasicConfig:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/SiteBasicConfig'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-UserRow:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/UserRow'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-any:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_CurrentRole:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/CurrentRole'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_FileGroupRow:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/FileGroupRow'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_FileRow:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/FileRow'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_PermissionDefinition:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/PermissionDefinition'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_RoleRow:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/RoleRow'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_UserRow:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/UserRow'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_string:
    properties:
      code:
        type: integer
      data:
        items:
          type: string
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-demo_DemoData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/DemoData'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-health_HealthData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/HealthData'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-hello_HelloData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/HelloData'
      message:
        type: string
      total:
        type: integer
    type: object
  RoleCreateRequest:
    properties:
      name:
        maxLength: 64
        type: string
      remark:
        maxLength: 255
        type: string
      sort:
        type: integer
      status:
        type: integer
    required:
    - name
    type: object
  RoleIDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  RoleListRequest:
    properties:
      keyword:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      status:
        type: integer
    type: object
  RolePermissionRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  RoleRow:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
    type: object
  RoleSavePermissionRequest:
    properties:
      id:
        type: integer
      permissions:
        items:
          type: string
        type: array
    required:
    - id
    type: object
  RoleUpdateRequest:
    properties:
      id:
        type: integer
      name:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
    required:
    - id
    type: object
  ShopBasicConfig:
    properties:
      description:
        description: 商城简介
        type: string
      favicon:
        description: 浏览器图标地址
        type: string
      favicon_id:
        description: 浏览器图标图片 ID
        type: integer
      logo:
        description: 商城 Logo 地址
        type: string
      logo_id:
        description: 商城 Logo 图片 ID
        type: integer
      name:
        description: 商城名称
        type: string
      service_name:
        description: 客服名称
        type: string
      service_phone:
        description: 客服电话
        type: string
      service_wechat:
        description: 客服微信
        type: string
      service_wechat_qrcode:
        description: 客服微信二维码地址
        type: string
      service_wechat_qrcode_id:
        description: 客服微信二维码图片 ID
        type: integer
    type: object
  SiteBasicConfig:
    properties:
      copyright:
        description: 版权信息
        type: string
      description:
        description: 网站描述
        type: string
      icp:
        description: ICP备案号
        type: string
      keywords:
        description: 网站关键词
        type: string
      title:
        description: 网站标题
        type: string
    type: object
  UpdateRequest:
    properties:
      id:
        type: integer
      nickname:
        type: string
      password:
        type: string
      status:
        type: integer
      username:
        type: string
    required:
    - id
    type: object
  UserRoleRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  UserRow:
    properties:
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  UserSaveRoleRequest:
    properties:
      id:
        type: integer
      role_ids:
        items:
          type: integer
        type: array
    required:
    - id
    type: object
host: localhost:8080
info:
  contact: {}
  description: Simple commerce administration backend.
  title: Mall Admin Core API
  version: 0.1.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      operationId: login
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-LoginResponse'
      summary: Login to the admin API
      tags:
      - auth
  /api/auth/me:
    get:
      operationId: getCurrentUser
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-CurrentUserResponse'
      security:
      - BearerAuth: []
      summary: Get the current login user, roles, and permissions
      tags:
      - auth
  /api/demo:
    get:
      operationId: getDemo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-demo_DemoData'
      summary: Get backend demo data
      tags:
      - demo
  /api/plugins/hello:
    get:
      operationId: getHelloPlugin
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-hello_HelloData'
      summary: Get hello plugin data
      tags:
      - plugins
  /api/system/files/config:
    get:
      consumes:
      - application/json
      operationId: getFileStorageConfig
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-FileStorageConfig'
      security:
      - BearerAuth: []
      summary: Get storage settings with secrets masked
      tags:
      - system-file
  /api/system/files/config/save:
    post:
      consumes:
      - application/json
      operationId: saveFileStorageConfig
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/FileStorageConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Save storage settings; empty secrets retain existing values
      tags:
      - system-file
  /api/system/files/delete:
    post:
      consumes:
      - application/json
      operationId: deleteSystemFiles
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/FileIDsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Archive images without breaking existing business file IDs
      tags:
      - system-file
  /api/system/files/groups:
    get:
      consumes:
      - application/json
      operationId: listSystemFileGroups
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_FileGroupRow'
      security:
      - BearerAuth: []
      summary: List image groups and counts
      tags:
      - system-file
  /api/system/files/groups/counts:
    get:
      consumes:
      - application/json
      operationId: getSystemFileGroupCounts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-FileGroupCounts'
      security:
      - BearerAuth: []
      summary: Get image counts for all, ungrouped, and each group
      tags:
      - system-file
  /api/system/files/groups/delete:
    post:
      consumes:
      - application/json
      operationId: deleteSystemFileGroup
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/FileGroupIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Delete a group and move its images to ungrouped
      tags:
      - system-file
  /api/system/files/groups/save:
    post:
      consumes:
      - application/json
      operationId: saveSystemFileGroup
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/FileGroupSaveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Create or rename an image group
      tags:
      - system-file
  /api/system/files/list:
    post:
      consumes:
      - application/json
      operationId: listSystemFiles
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/FileListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_FileRow'
      security:
      - BearerAuth: []
      summary: List and search images
      tags:
      - system-file
  /api/system/files/move:
    post:
      consumes:
      - application/json
      operationId: moveSystemFiles
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/FileMoveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Move images to a group
      tags:
      - system-file
  /api/system/files/rename:
    post:
      consumes:
      - application/json
      operationId: renameSystemFile
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/FileRenameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Rename an image display name
      tags:
      - system-file
  /api/system/files/resolve:
    post:
      consumes:
      - application/json
      operationId: resolveSystemFiles
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/FileIDsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_FileRow'
      security:
      - BearerAuth: []
      summary: Resolve business file IDs into current URLs (including archived images)
      tags:
      - system-file
  /api/system/files/upload:
    post:
      consumes:
      - multipart/form-data
      operationId: uploadSystemFile
      parameters:
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      - description: Group ID; zero means ungrouped
        in: formData
        name: group_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-FileRow'
      security:
      - BearerAuth: []
      summary: Upload one image (10 MB maximum); call for each file in a batch
      tags:
      - system-file
  /api/system/permissions/list:
    get:
      operationId: listAllPermissions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_PermissionDefinition'
      security:
      - BearerAuth: []
      summary: List all permission definitions
      tags:
      - system-permission
  /api/system/roles/create:
    post:
      consumes:
      - application/json
      operationId: createSystemRole
      parameters:
      - description: Create system role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-RoleRow'
      security:
      - BearerAuth: []
      summary: Create a system role
      tags:
      - system-role
  /api/system/roles/delete:
    post:
      consumes:
      - application/json
      operationId: deleteSystemRole
      parameters:
      - description: Delete system role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: Delete a system role
      tags:
      - system-role
  /api/system/roles/detail:
    post:
      consumes:
      - application/json
      operationId: getSystemRole
      parameters:
      - description: Get system role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-RoleRow'
      security:
      - BearerAuth: []
      summary: Get a system role
      tags:
      - system-role
  /api/system/roles/list:
    post:
      consumes:
      - application/json
      operationId: listSystemRoles
      parameters:
      - description: List system roles request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RoleListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_RoleRow'
      security:
      - BearerAuth: []
      summary: List system roles
      tags:
      - system-role
  /api/system/roles/permissions:
    post:
