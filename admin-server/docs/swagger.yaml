        minLength: 6
        type: string
      status:
        type: integer
      username:
        maxLength: 64
        type: string
    required:
    - password
    - username
    type: object
  CurrentRole:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: integer
    type: object
  CurrentUser:
    properties:
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  CurrentUserResponse:
    properties:
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          $ref: '#/definitions/CurrentRole'
        type: array
      user:
        $ref: '#/definitions/CurrentUser'
    type: object
  DemoData:
    properties:
      database:
        example: not_configured
        type: string
      message:
        example: Mall API is running
        type: string
    type: object
  FileGroupCounts:
    properties:
      groups:
        items:
          $ref: '#/definitions/FileGroupRow'
        type: array
