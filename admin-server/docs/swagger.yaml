basePath: /
definitions:
  CreateRequest:
    properties:
      nickname:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
      status:
        type: integer
      username:
        maxLength: 64
        type: string
    required:
    - password
    - username
    type: object
  DemoData:
    properties:
      database:
        example: not_configured
        type: string
      message:
        example: Mall API is running
        type: string
    type: object
  HealthData:
    properties:
      database:
        example: not_configured
        type: string
      service:
        example: mall-admin-core
        type: string
      status:
        example: ok
        type: string
    type: object
  HelloData:
    properties:
      message:
        example: Hello from plugin
        type: string
      plugin:
        example: hello
        type: string
    type: object
  IDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  ListRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      username:
        type: string
    type: object
  Response-UserRow:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/UserRow'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-any:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_UserRow:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/UserRow'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-demo_DemoData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/DemoData'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-health_HealthData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/HealthData'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-hello_HelloData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/HelloData'
      message:
        type: string
      total:
        type: integer
    type: object
  UpdateRequest:
    properties:
      id:
        type: integer
      nickname:
        type: string
      password:
        type: string
      status:
        type: integer
      username:
        type: string
    required:
    - id
    type: object
  UserRow:
    properties:
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Simple commerce administration backend.
  title: Mall Admin Core API
  version: 0.1.0
paths:
  /api/demo:
    get:
      operationId: getDemo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-demo_DemoData'
      summary: Get backend demo data
      tags:
      - demo
  /api/plugins/hello:
    get:
      operationId: getHelloPlugin
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-hello_HelloData'
      summary: Get hello plugin data
      tags:
      - plugins
  /api/system/users/create:
    post:
      consumes:
      - application/json
      operationId: createSystemUser
      parameters:
      - description: Create system user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-UserRow'
      summary: Create a system user
      tags:
      - system-user
  /api/system/users/delete:
    post:
      consumes:
      - application/json
      operationId: deleteSystemUser
      parameters:
      - description: Delete system user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/IDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      summary: Delete a system user
      tags:
      - system-user
  /api/system/users/detail:
    post:
      consumes:
      - application/json
      operationId: getSystemUser
      parameters:
      - description: Get system user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/IDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-UserRow'
      summary: Get a system user
      tags:
      - system-user
  /api/system/users/list:
    post:
      consumes:
      - application/json
      operationId: listSystemUsers
      parameters:
      - description: List system users request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_UserRow'
      summary: List system users
      tags:
      - system-user
  /api/system/users/update:
    post:
      consumes:
      - application/json
      operationId: updateSystemUser
      parameters:
      - description: Update system user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-UserRow'
      summary: Update a system user
      tags:
      - system-user
  /health:
    get:
      operationId: getHealth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-health_HealthData'
      summary: Check service health
      tags:
      - system
swagger: "2.0"
