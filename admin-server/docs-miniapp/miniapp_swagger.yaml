basePath: /api/miniapp
definitions:
  AuthResponse:
    properties:
      expires_at:
        type: string
      is_new_member:
        type: boolean
      member:
        $ref: '#/definitions/MemberInfo'
      token:
        type: string
    type: object
  BootstrapCategory:
    properties:
      id:
        type: integer
      image_url:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
    type: object
  BootstrapMp:
    properties:
      name:
        type: string
      original_id:
        type: string
      qrcode:
        type: string
    type: object
  BootstrapResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/BootstrapCategory'
        type: array
      mp:
        $ref: '#/definitions/BootstrapMp'
      shop:
        $ref: '#/definitions/BootstrapShop'
      site:
        $ref: '#/definitions/BootstrapSite'
    type: object
  BootstrapShop:
    properties:
      description:
        type: string
      logo:
        type: string
      name:
        type: string
      service_name:
        type: string
      service_phone:
        type: string
      service_wechat:
        type: string
      service_wechat_qrcode:
        type: string
    type: object
  BootstrapSite:
    properties:
      copyright:
        type: string
      description:
        type: string
      icp:
        type: string
      keywords:
        type: string
      title:
        type: string
    type: object
  HelloResponse:
    properties:
      text:
        example: Hello World
        type: string
    type: object
  LoginRequest:
    properties:
      mobile:
        type: string
      password:
        type: string
    required:
    - mobile
    - password
    type: object
  MemberInfo:
    properties:
      avatar_id:
        type: integer
      avatar_url:
        type: string
      created_at:
        type: string
      id:
        type: integer
      last_login_at:
        type: string
      mobile:
        type: string
      nickname:
        type: string
      status:
        type: integer
    type: object
  MiniappAddressCreateRequest:
    properties:
      address:
        type: string
      city:
        type: string
      city_code:
        type: string
      district:
        type: string
      district_code:
        type: string
      is_default:
        type: integer
      mobile:
        type: string
      name:
        type: string
      postal_code:
        type: string
      province:
        type: string
      province_code:
        type: string
    required:
    - address
    - city
    - city_code
    - district
    - district_code
    - mobile
    - name
    - province
    - province_code
    type: object
  MiniappAddressIDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  MiniappAddressResponse:
    properties:
      address:
        type: string
      city:
        type: string
      city_code:
        type: string
      created_at:
        type: string
      district:
        type: string
      district_code:
        type: string
      id:
        type: integer
      is_default:
        type: integer
      member_id:
        type: integer
      mobile:
        type: string
      name:
        type: string
      postal_code:
        type: string
      province:
        type: string
      province_code:
        type: string
    type: object
  MiniappAddressUpdateRequest:
    properties:
      address:
        type: string
      city:
        type: string
      city_code:
        type: string
      district:
        type: string
      district_code:
        type: string
      id:
        type: integer
      is_default:
        type: integer
      mobile:
        type: string
      name:
        type: string
      postal_code:
        type: string
      province:
        type: string
      province_code:
        type: string
    required:
    - address
    - city
    - city_code
    - district
    - district_code
    - id
    - mobile
    - name
    - province
    - province_code
    type: object
  MiniappAvatarResponse:
    properties:
      avatar_id:
        type: integer
      avatar_url:
        type: string
    type: object
  MiniappCartAddRequest:
    properties:
      quantity:
        type: integer
      sku_id:
        type: integer
    required:
    - quantity
    - sku_id
    type: object
  MiniappCartDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  MiniappCartItemResponse:
    properties:
      available:
        type: boolean
      id:
        type: integer
      image_url:
        type: string
      market_price:
        type: string
      price:
        type: string
      product_id:
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
      sku_id:
        type: integer
      spec_values:
        items:
          $ref: '#/definitions/MiniappCartSpecValue'
        type: array
      stock:
        type: integer
      unavailable_reason:
        type: string
    type: object
  MiniappCartSpecValue:
    properties:
      spec_id:
        type: integer
      spec_name:
        type: string
      value_id:
        type: integer
      value_name:
        type: string
    type: object
  MiniappCartUpdateQuantityRequest:
    properties:
      id:
        type: integer
      quantity:
        type: integer
    required:
    - id
    - quantity
    type: object
  MiniappCheckoutAddressResponse:
    properties:
      address:
        type: string
      city:
        type: string
      city_code:
        type: string
      district:
        type: string
      district_code:
        type: string
      id:
        type: integer
      is_default:
        type: integer
      mobile:
        type: string
      name:
        type: string
      postal_code:
        type: string
        x-nullable: true
      province:
        type: string
      province_code:
        type: string
    type: object
  MiniappCheckoutItemRequest:
    properties:
      quantity:
        type: integer
      sku_id:
        type: integer
    required:
    - quantity
    - sku_id
    type: object
  MiniappCheckoutItemResponse:
    properties:
      deliverable:
        type: boolean
      image_url:
        type: string
      product_id:
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
      sku_code:
        type: string
      sku_id:
        type: integer
      sku_spec_values:
        type: string
      stock:
        type: integer
      total_amount:
        type: string
      undeliverable_reason:
        type: string
      unit_price:
        type: string
    type: object
  MiniappCheckoutPreviewRequest:
    properties:
      address_id:
        type: integer
      items:
        items:
          $ref: '#/definitions/MiniappCheckoutItemRequest'
        minItems: 1
        type: array
    required:
    - items
    type: object
  MiniappCheckoutPreviewResponse:
    properties:
      address:
        allOf:
        - $ref: '#/definitions/MiniappCheckoutAddressResponse'
        x-nullable: true
      deliverable:
        type: boolean
      discount_amount:
        type: string
      freight_amount:
        type: string
      items:
        items:
          $ref: '#/definitions/MiniappCheckoutItemResponse'
        type: array
      pay_amount:
        type: string
      total_amount:
        type: string
      total_quantity:
        type: integer
      undeliverable_reason:
        type: string
    type: object
  MiniappMemberInfo:
    properties:
      avatar_id:
        type: integer
      avatar_url:
        type: string
      created_at:
        type: string
      id:
        type: integer
      last_login_at:
        type: string
      mobile:
        type: string
      nickname:
        type: string
      status:
        type: integer
    type: object
  MiniappOrderAddressResponse:
    properties:
      address:
        type: string
      city:
        type: string
      city_code:
        type: string
      district:
        type: string
      district_code:
        type: string
      mobile:
        type: string
      name:
        type: string
      postal_code:
        type: string
        x-nullable: true
      province:
        type: string
      province_code:
        type: string
    type: object
  MiniappOrderCreateRequest:
    properties:
      address_id:
        type: integer
      items:
        items:
          $ref: '#/definitions/MiniappCheckoutItemRequest'
        minItems: 1
        type: array
      remark:
        maxLength: 255
        type: string
      request_id:
        maxLength: 64
        type: string
    required:
    - address_id
    - items
    - request_id
    type: object
  MiniappOrderDetailResponse:
    properties:
      address:
        allOf:
        - $ref: '#/definitions/MiniappOrderAddressResponse'
        x-nullable: true
      cancelled_at:
        type: string
        x-nullable: true
      completed_at:
        type: string
        x-nullable: true
      created_at:
        type: string
      discount_amount:
        type: string
      express_company:
        type: string
        x-nullable: true
      express_no:
        type: string
        x-nullable: true
      freight_amount:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/MiniappOrderItemResponse'
        type: array
      logs:
        items:
          $ref: '#/definitions/MiniappOrderLogResponse'
        type: array
      order_no:
        type: string
      paid_at:
        type: string
        x-nullable: true
      pay_amount:
        type: string
      remark:
        type: string
      shipped_at:
        type: string
        x-nullable: true
      status:
        type: integer
      status_text:
        type: string
      total_amount:
        type: string
    type: object
  MiniappOrderItemResponse:
    properties:
      id:
        type: integer
      image_url:
        type: string
      product_id:
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
      sku_code:
        type: string
      sku_id:
        type: integer
      sku_spec_values:
        type: string
        x-nullable: true
      total_amount:
        type: string
      unit_price:
        type: string
    type: object
  MiniappOrderListItemResponse:
    properties:
      created_at:
        type: string
      express_company:
        type: string
        x-nullable: true
      express_no:
        type: string
        x-nullable: true
      freight_amount:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/MiniappOrderItemResponse'
        type: array
      order_no:
        type: string
      pay_amount:
        type: string
      status:
        type: integer
      status_text:
        type: string
      total_amount:
        type: string
      total_quantity:
        type: integer
    type: object
  MiniappOrderLogResponse:
    properties:
      action:
        type: string
      created_at:
        type: string
      from_status:
        type: integer
      from_status_text:
        type: string
      operator_name:
        type: string
      operator_type:
        type: string
      remark:
        type: string
      to_status:
        type: integer
      to_status_text:
        type: string
    type: object
  MiniappProductDetailResponse:
    properties:
      category_id:
        type: integer
      detail:
        type: string
      gallery_urls:
        items:
          type: string
        type: array
      id:
        type: integer
      main_image_url:
        type: string
      market_price:
        type: string
      name:
        type: string
      params:
        items:
          $ref: '#/definitions/MiniappProductParam'
        type: array
      price:
        type: string
      sales:
        type: integer
      skus:
        items:
          $ref: '#/definitions/MiniappProductSKUItem'
        type: array
      specs:
        items:
          $ref: '#/definitions/MiniappProductSpec'
        type: array
      subtitle:
        type: string
    type: object
  MiniappProductListItem:
    properties:
      category_id:
        type: integer
      id:
        type: integer
      main_image_url:
        type: string
      market_price:
        type: string
      name:
        type: string
      price:
        type: string
      sales:
        type: integer
      stock:
        type: integer
      subtitle:
        type: string
    type: object
  MiniappProductParam:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  MiniappProductSKUItem:
    properties:
      id:
        type: integer
      image_url:
        type: string
      market_price:
        type: string
      price:
        type: string
      spec_values:
        items:
          $ref: '#/definitions/MiniappProductSKUValue'
        type: array
      stock:
        type: integer
      unit:
        type: string
        x-nullable: true
      weight_gram:
        type: integer
        x-nullable: true
    type: object
  MiniappProductSKUValue:
    properties:
      spec_id:
        type: integer
      value_id:
        type: integer
    type: object
  MiniappProductSpec:
    properties:
      id:
        type: integer
      name:
        type: string
      values:
        items:
          $ref: '#/definitions/MiniappProductSpecValue'
        type: array
    type: object
  MiniappProductSpecValue:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  MiniappRegionsData:
    properties:
      regions:
        items:
          $ref: '#/definitions/RegionNode'
        type: array
      version:
        type: string
    type: object
  MiniappUpdateProfileRequest:
    properties:
      mobile:
        type: string
      nickname:
        type: string
    type: object
  RegionNode:
    properties:
      children:
        items:
          $ref: '#/definitions/RegionNode'
        type: array
      code:
        type: string
      name:
        type: string
    type: object
  RegisterRequest:
    properties:
      mobile:
        type: string
      nickname:
        type: string
      password:
        type: string
    required:
    - mobile
    - password
    type: object
  Response-AuthResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/AuthResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-BootstrapResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/BootstrapResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-MiniappAddressResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/MiniappAddressResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-MiniappAvatarResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/MiniappAvatarResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-MiniappCheckoutPreviewResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/MiniappCheckoutPreviewResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-MiniappMemberInfo:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/MiniappMemberInfo'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-MiniappOrderDetailResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/MiniappOrderDetailResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-MiniappProductDetailResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/MiniappProductDetailResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-any:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_MiniappAddressResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/MiniappAddressResponse'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_MiniappCartItemResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/MiniappCartItemResponse'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_MiniappOrderListItemResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/MiniappOrderListItemResponse'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-array_MiniappProductListItem:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/MiniappProductListItem'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  Response-common_HelloResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/HelloResponse'
      message:
        type: string
      total:
        type: integer
    type: object
  Response-region_MiniappRegionsData:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/MiniappRegionsData'
      message:
        type: string
      total:
        type: integer
    type: object
  WechatLoginRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
info:
  contact: {}
  description: AI Shop Miniapp API
  title: AI Shop Miniapp API
  version: 0.1.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      operationId: miniappLogin
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-AuthResponse'
      summary: 会员登录 (手机号+密码)
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      operationId: miniappRegister
      parameters:
      - description: 注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-AuthResponse'
      summary: 会员注册 (手机号+密码)
      tags:
      - auth
  /auth/wechat-login:
    post:
      consumes:
      - application/json
      operationId: miniappWechatLogin
      parameters:
      - description: 微信登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/WechatLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-AuthResponse'
      summary: 微信小程序登录
      tags:
      - auth
  /bootstrap:
    get:
      operationId: miniappBootstrap
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-BootstrapResponse'
      summary: 获取小程序公共启动配置
      tags:
      - common
  /cart:
    get:
      operationId: miniappCartList
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: 获取购物车列表
      tags:
      - cart
  /cart/add:
    post:
      consumes:
      - application/json
      operationId: miniappCartAdd
      parameters:
      - description: 加入购物车参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/MiniappCartAddRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: 加入购物车
      tags:
      - cart
  /cart/delete:
    post:
      consumes:
      - application/json
      operationId: miniappCartDelete
      parameters:
      - description: 删除购物车参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/MiniappCartDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: 删除购物车商品 (支持批量)
      tags:
      - cart
  /cart/quantity:
    post:
      consumes:
      - application/json
      operationId: miniappCartUpdateQuantity
      parameters:
      - description: 修改数量参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/MiniappCartUpdateQuantityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      security:
      - BearerAuth: []
      summary: 修改购物车商品数量
      tags:
      - cart
  /checkout/preview:
    post:
      consumes:
      - application/json
      operationId: miniappCheckoutPreview
      parameters:
      - description: 结账预览参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/MiniappCheckoutPreviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-any'
      summary: 结账预览 (计算金额、地址、库存及明细)
      tags:
      - order
  /hello:
    get:
      operationId: miniappHello
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-common_HelloResponse'
      summary: Miniapp hello world
      tags:
      - common
  /member/addresses:
    get:
      operationId: miniappMemberAddresses
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_MiniappAddressResponse'
      security:
      - BearerAuth: []
      summary: 获取会员收货地址列表
      tags:
      - member
  /member/addresses/create:
    post:
      consumes:
      - application/json
      operationId: miniappMemberAddressCreate
      parameters:
      - description: 创建收货地址请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/MiniappAddressCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-MiniappAddressResponse'
      security:
      - BearerAuth: []
      summary: 创建收货地址
      tags:
      - member
  /member/addresses/default:
    post:
      consumes:
      - application/json
      operationId: miniappMemberAddressDefault
